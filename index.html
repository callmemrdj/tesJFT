<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Simulasi JFT Basic - Mr.DJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], jp: ['"Noto Sans JP"', 'sans-serif'] } } } };
    </script>
    <style>
      :root {
        --bg: #060d09;
        --card: rgba(12, 26, 18, 0.93);
        --accent: #10b981;
        --accent-light: #34d399;
        --accent-glow: rgba(16, 185, 129, 0.25);
        --fg: #ecfdf5;
        --fg-dim: #a7c4b5;
        --muted: #4a6b5a;
        --border: rgba(16, 185, 129, 0.12);
        --sel-bg: #10b981;
        --sel-fg: #022c22;
        --panel-bg: rgba(6, 13, 9, 0.97);
        --panel-h: 116px;
        --amber: #f59e0b;
        --amber-dark: #92400e;
        --danger: #ef4444;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .welcome-bg {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 600px 400px at 20% 30%, rgba(16, 185, 129, 0.07), transparent), radial-gradient(ellipse 500px 500px at 80% 70%, rgba(6, 95, 70, 0.09), transparent),
          radial-gradient(ellipse 900px 700px at 50% 50%, rgba(16, 185, 129, 0.025), transparent), var(--bg);
        z-index: 0;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.35;
        animation: orbF 10s ease-in-out infinite;
      }
      .orb-1 {
        width: 320px;
        height: 320px;
        background: rgba(16, 185, 129, 0.14);
        top: 8%;
        left: 8%;
      }
      .orb-2 {
        width: 260px;
        height: 260px;
        background: rgba(6, 95, 70, 0.18);
        bottom: 15%;
        right: 8%;
        animation-delay: -4s;
        animation-duration: 13s;
      }
      .orb-3 {
        width: 200px;
        height: 200px;
        background: rgba(52, 211, 153, 0.08);
        top: 55%;
        left: 45%;
        animation-delay: -7s;
        animation-duration: 15s;
      }
      @keyframes orbF {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(25px, -18px) scale(1.04);
        }
        66% {
          transform: translate(-18px, 12px) scale(0.96);
        }
      }
      .glass {
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 20px;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.025);
      }
      .name-input {
        background: rgba(6, 13, 9, 0.8);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        color: var(--fg);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 16px;
        width: 100%;
        outline: none;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }
      .name-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .name-input::placeholder {
        color: var(--muted);
      }
      .btn-start {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #022c22;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 44px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.25s;
        box-shadow: 0 4px 18px rgba(16, 185, 129, 0.3);
        letter-spacing: 0.3px;
      }
      .btn-start:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(16, 185, 129, 0.4);
      }
      .btn-start:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn-start:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .floating-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--panel-bg);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        z-index: 100;
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        box-shadow: 0 -12px 45px rgba(0, 0, 0, 0.55);
        transition: opacity 0.4s;
      }
      .nav-btn {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        border: 1.5px solid var(--border);
        background: rgba(16, 185, 129, 0.05);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .nav-btn:hover:not(:disabled) {
        background: rgba(16, 185, 129, 0.14);
        border-color: var(--accent);
      }
      .nav-btn:active:not(:disabled) {
        transform: scale(0.9);
      }
      .nav-btn:disabled {
        opacity: 0.2;
        cursor: not-allowed;
      }
      .audio-btn {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        border: 1.5px solid rgba(52, 211, 153, 0.2);
        background: rgba(52, 211, 153, 0.06);
        color: var(--accent-light);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
        visibility: hidden;
      }
      .audio-btn.vis {
        visibility: visible;
      }
      .audio-btn:hover:not(:disabled) {
        background: rgba(52, 211, 153, 0.18);
        border-color: var(--accent-light);
      }
      .audio-btn:active:not(:disabled) {
        transform: scale(0.88);
      }
      .audio-btn:disabled {
        opacity: 0.2;
        cursor: not-allowed;
      }
      .audio-btn.playing {
        background: rgba(16, 185, 129, 0.2);
        border-color: var(--accent);
        animation: aPulse 1.4s ease-in-out infinite;
      }
      @keyframes aPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
        }
      }
      .submit-btn {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        border: none;
        background: linear-gradient(135deg, var(--amber), #d97706);
        color: var(--amber-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
        box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
      }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
      }
      .submit-btn:active:not(:disabled) {
        transform: scale(0.92);
      }
      .submit-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        transform: none;
      }
      .submit-btn.done {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #022c22;
      }
      .answer-btn {
        flex: 1;
        height: 48px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        background: rgba(16, 185, 129, 0.035);
        color: var(--fg-dim);
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .answer-btn:hover:not(.selected):not(:disabled) {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.3);
        color: var(--fg);
      }
      .answer-btn:active:not(.selected):not(:disabled) {
        transform: scale(0.94);
      }
      .answer-btn.selected {
        background: var(--sel-bg);
        color: var(--sel-fg);
        border-color: var(--sel-bg);
        box-shadow: 0 2px 14px rgba(16, 185, 129, 0.35);
        font-weight: 700;
      }
      .answer-btn.selected::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 60%);
        pointer-events: none;
      }
      .answer-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
      }
      .q-num {
        font-size: 13px;
        font-weight: 500;
        color: var(--fg-dim);
        min-width: 82px;
        text-align: center;
        line-height: 44px;
        flex: 1;
      }
      .q-num b {
        color: var(--accent-light);
        font-size: 19px;
        font-weight: 700;
      }
      .q-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-left: 3px;
        vertical-align: middle;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .q-dot.on {
        opacity: 1;
      }
      .prog-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(16, 185, 129, 0.08);
        z-index: 200;
      }
      .prog-fill {
        height: 100%;
        background: linear-gradient(90deg, #10b981, #34d399);
        transition: width 0.4s ease;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        border-radius: 0 2px 2px 0;
      }
      /* Timer strip */
      .timer-strip {
        position: fixed;
        top: 3px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;
        display: none;
        align-items: center;
        gap: 5px;
        background: rgba(6, 13, 9, 0.93);
        border: 1px solid var(--border);
        border-top: none;
        border-radius: 0 0 10px 10px;
        padding: 4px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg-dim);
        font-variant-numeric: tabular-nums;
        backdrop-filter: blur(10px);
        letter-spacing: 0.5px;
        transition:
          color 0.3s,
          border-color 0.3s;
      }
      .timer-strip .material-icons-round {
        font-size: 15px;
      }
      .timer-strip.warn {
        color: var(--amber);
        border-color: rgba(245, 158, 11, 0.25);
      }
      .timer-strip.crit {
        color: var(--danger);
        border-color: rgba(239, 68, 68, 0.3);
        animation: tPulse 1s infinite;
      }
      @keyframes tPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      /* Toast */
      .toast {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 20px;
        color: var(--accent-light);
        font-size: 13px;
        font-weight: 500;
        z-index: 300;
        backdrop-filter: blur(12px);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      /* Zoom */
      .zoom-bar {
        position: fixed;
        top: 10px;
        left: 12px;
        z-index: 150;
        display: none;
        align-items: center;
        gap: 3px;
        background: rgba(6, 13, 9, 0.88);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 4px 6px;
        backdrop-filter: blur(10px);
        transition: opacity 0.3s;
      }
      .zoom-bar.dim {
        opacity: 0.45;
      }
      .zoom-bar.dim:hover {
        opacity: 1;
      }
      .z-btn {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        border: none;
        background: transparent;
        color: var(--fg-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .z-btn:hover {
        background: rgba(16, 185, 129, 0.15);
        color: var(--fg);
      }
      .z-btn:active {
        transform: scale(0.88);
      }
      .z-btn:disabled {
        opacity: 0.2;
        cursor: not-allowed;
        transform: none;
      }
      .z-pct {
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-dim);
        min-width: 36px;
        text-align: center;
        pointer-events: none;
      }
      .z-sep {
        width: 1px;
        height: 16px;
        background: var(--border);
        flex-shrink: 0;
      }
      /* PDF */
      .pdf-wrap {
        width: 100%;
        height: calc(100dvh - var(--panel-h));
        height: calc(100vh - var(--panel-h));
        background: #111;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        position: relative;
      }
      .pdf-wrap iframe {
        border: none;
        display: block;
        transform-origin: 0 0;
        will-change: transform;
        transition: margin 0.15s ease;
      }
      /* Resume */
      .resume-banner {
        background: rgba(16, 185, 129, 0.07);
        border: 1px solid rgba(16, 185, 129, 0.18);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 20px;
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--fg-dim);
      }
      .resume-banner .material-icons-round {
        color: var(--accent);
        font-size: 20px;
        flex-shrink: 0;
      }
      .resume-btn {
        margin-left: auto;
        background: var(--accent);
        color: var(--sel-fg);
        border: none;
        border-radius: 8px;
        padding: 6px 14px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .resume-btn:hover {
        background: var(--accent-light);
      }
      /* Screens */
      .screen {
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }
      .screen.hidden {
        opacity: 0;
        pointer-events: none;
        position: absolute;
        transform: scale(0.97);
      }
      .screen.visible {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }
      .reset-link {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 150;
        background: rgba(6, 13, 9, 0.88);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        color: var(--muted);
        font-size: 11px;
        font-family: 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: all 0.2s;
        display: none;
        backdrop-filter: blur(10px);
      }
      .reset-link:hover {
        color: var(--danger);
        border-color: rgba(239, 68, 68, 0.3);
      }
      /* Dialog */
      .dialog-overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        animation: fadeIn 0.25s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .dialog-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 24px 22px;
        max-width: 340px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-height: 85vh;
        overflow-y: auto;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .dialog-box .material-icons-round.dlg-icon {
        font-size: 38px;
        margin-bottom: 10px;
        display: block;
      }
      .dialog-box h3 {
        font-size: 17px;
        font-weight: 700;
        color: var(--fg);
        margin-bottom: 6px;
      }
      .dialog-box p {
        font-size: 13px;
        color: var(--fg-dim);
        margin-bottom: 4px;
        line-height: 1.5;
      }
      .dialog-box .warn {
        color: var(--amber);
        font-size: 12px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .dialog-box .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        justify-content: center;
      }
      .dialog-box .btn-dlg {
        flex: 1;
        padding: 11px;
        border-radius: 10px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .dialog-box .btn-dlg:active {
        transform: scale(0.96);
      }
      .dialog-box .btn-dlg.cancel {
        border: 1.5px solid var(--border);
        background: transparent;
        color: var(--fg-dim);
      }
      .dialog-box .btn-dlg.cancel:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.12);
      }
      .dialog-box .btn-dlg.green {
        border: none;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #022c22;
        box-shadow: 0 2px 12px rgba(16, 185, 129, 0.3);
      }
      .dialog-box .btn-dlg.amber {
        border: none;
        background: linear-gradient(135deg, var(--amber), #d97706);
        color: var(--amber-dark);
        box-shadow: 0 2px 12px rgba(245, 158, 11, 0.3);
      }
      .dialog-box .btn-dlg.red {
        border: none;
        background: var(--danger);
        color: #fff;
        box-shadow: 0 2px 12px rgba(239, 68, 68, 0.3);
      }
      .dialog-box .btn-dlg:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .dialog-box .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .dialog-box .summary-row:last-of-type {
        border-bottom: none;
      }
      .dialog-box .summary-label {
        color: var(--fg-dim);
      }
      .dialog-box .summary-val {
        color: var(--fg);
        font-weight: 600;
      }
      .answer-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 2px 6px;
        text-align: left;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        margin: 8px 0 0;
      }
      .answer-grid span {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.9;
      }
      .floating-panel.submitted .nav-row {
        display: none;
      }
      .floating-panel.submitted .answer-row {
        display: none;
      }
      .floating-panel.submitted .done-row {
        display: flex !important;
      }
      .done-row {
        display: none !important;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 4px 0;
        color: var(--accent-light);
        font-weight: 600;
        font-size: 14px;
      }
      .done-row .material-icons-round {
        font-size: 20px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
        vertical-align: middle;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Freeze overlay */
      .freeze-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(0, 0, 0, 0.3);
        pointer-events: auto;
        animation: fadeIn 0.5s ease;
      }
      @media (max-height: 580px) {
        :root {
          --panel-h: 96px;
        }
        .floating-panel {
          padding: 6px 10px;
          padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        .nav-btn,
        .audio-btn,
        .submit-btn {
          width: 38px;
          height: 38px;
          border-radius: 9px;
        }
        .nav-btn .material-icons-round,
        .audio-btn .material-icons-round,
        .submit-btn .material-icons-round {
          font-size: 20px !important;
        }
        .answer-btn {
          height: 40px;
          font-size: 14px;
          border-radius: 8px;
        }
        .q-num {
          font-size: 11px;
          min-width: 68px;
          line-height: 38px;
        }
        .q-num b {
          font-size: 16px;
        }
        .zoom-bar {
          top: 6px;
          left: 8px;
          padding: 3px 4px;
        }

    <script>
      /*
    ============================================================
    SETUP GOOGLE SHEETS — FORMAT BARIS
    ============================================================
    1. Buat Google Sheets baru
    2. Klik Extensions → Apps Script
    3. Hapus semua kode, paste:

    function doPost(e) {
      var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
      var data = JSON.parse(e.parameter.payload);
      if (sheet.getLastRow() === 0) {
        var h = ['Nama', 'Waktu'];
        for (var i = 1; i <= data.total; i++) h.push('Soal ' + i);
        sheet.appendRow(h);
      }
      var row = [data.nama, data.waktu];
      for (var i = 1; i <= data.total; i++) row.push(data.jawaban[String(i)] || '-');
      sheet.appendRow(row);
      return ContentService.createTextOutput(JSON.stringify({status:'ok'})).setMimeType(ContentService.MimeType.JSON);
    }

    4. Deploy → New deployment → ⚙️ "Web app"
    5. Execute as: Me | Who has access: Anyone
    6. Deploy → izinkan → salin URL (WAJIB /exec)
    7. Paste di GOOGLE_SHEET_URL
    ============================================================
    */

      // ===================== KONFIGURASI =====================
      const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzf6HUzlTL0YuAqbuV5q4eyQtooDVeNQm-iDpyDk9DVca8pTc4XSN0TA6kUQEwDuCy2_g/exec';
      const TOTAL_SOAL = 84;
      const PDF_URL = 'https://drive.google.com/file/d/1an2Ce2b5TdtpWv5Y6ArWPzJ701CYPI79/preview';
      const STORAGE_KEY = 'jft_basic_v6';
      const TIMER_MINUTES = 60; // durasi tes

      // Peta soal → URL audio. Tambahkan sesuai kebutuhan.
      const AUDIO_MAP = {
        15: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-02]_kiku2.mp3',
        16: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-04]_kiku4.mp3',
        17: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-03]_kiku3.mp3',
        18: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-01]_kiku1.mp3',
        19: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-07]_kaiwa.mp3',
        20: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-07]_kaiwa.mp3',
        21: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/03/X_[03-07]_kaiwa.mp3',
        47: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/04/X_[04-03]_kiku1.mp3',
        48: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/04/X_[04-04]_kiku2.mp3',
        49: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/04/X_[04-21]_kiku4.mp3',
        50: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/04/X_[04-20]_kiku3.mp3',
        51: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/04/X_[04-18]_kiku1.mp3',
        80: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/05/X_[05-01]_kiku1.mp3',
        81: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/05/X_[05-02]_kiku2.mp3',
        82: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/05/X_[05-11]_kiku1.mp3',
        83: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/05/X_[05-13]_kiku3.mp3',
        84: 'https://www.irodori.jpf.go.jp/assets/data/starter/audio/05/X_[05-14]_kiku4.mp3',

        // contoh: 20: 'https://example.com/audio/soal20.mp3',
      };

      // Zoom
      const ZOOM_MIN = 0.5,
        ZOOM_MAX = 4.0,
        ZOOM_STEP = 0.25;

      // ===================== STATE =====================
      var userName = '',
        currentSoal = 1,
        jawaban = {};
      var isSubmitted = false,
        isFrozen = false;
      var zoomLevel = 1;
      var remainingTime = TIMER_MINUTES * 60;
      var timerInterval = null,
        _saveTick = 0;
      var currentAudio = null,
        isAudioPlaying = false;

      // ===================== DOM =====================
      var $welcome = document.getElementById('welcomeScreen');
      var $test = document.getElementById('testScreen');
      var $nameInput = document.getElementById('nameInput');
      var $startBtn = document.getElementById('startBtn');
      var $prevBtn = document.getElementById('prevBtn');
      var $nextBtn = document.getElementById('nextBtn');
      var $submitBtn = document.getElementById('submitBtn');
      var $audioBtn = document.getElementById('audioBtn');
      var $curNum = document.getElementById('curNum');
      var $totNum = document.getElementById('totNum');
      var $answerRow = document.getElementById('answerRow');
      var $progFill = document.getElementById('progFill');
      var $toast = document.getElementById('toast');
      var $toastText = document.getElementById('toastText');
      var $pdfFrame = document.getElementById('pdfFrame');
      var $pdfWrap = document.getElementById('pdfWrap');
      var $resumeBanner = document.getElementById('resumeBanner');
      var $resumeText = document.getElementById('resumeText');
      var $resumeBtn = document.getElementById('resumeBtn');
      var $resetBtn = document.getElementById('resetBtn');
      var $qDot = document.getElementById('qDot');
      var $panel = document.getElementById('panel');
      var $doneText = document.getElementById('doneText');
      var $zoomBar = document.getElementById('zoomBar');
      var $zoomPct = document.getElementById('zoomPct');
      var $timerStrip = document.getElementById('timerStrip');
      var $timerDisplay = document.getElementById('timerDisplay');

      $totNum.textContent = TOTAL_SOAL;

      // ===================== CEGAH REFRESH =====================
      window.addEventListener('beforeunload', function (e) {
        if (!isSubmitted && !isFrozen && Object.keys(jawaban).length > 0) {
          e.preventDefault();
          e.returnValue = '';
          return '';
        }
      });

      // ===================== LOCAL STORAGE =====================
      function simpanSesi() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ nama: userName, currentSoal: currentSoal, jawaban: jawaban, remainingTime: remainingTime, ts: Date.now() }));
        } catch (_) {}
      }
      function muatSesi() {
        try {
          var r = localStorage.getItem(STORAGE_KEY);
          return r ? JSON.parse(r) : null;
        } catch (_) {
          return null;
        }
      }
      function hapusSesi() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
      }

      // ===================== TOAST =====================
      var _tt = null;
      function showToast(msg, icon) {
        $toastText.textContent = msg;
        $toast.querySelector('.material-icons-round').textContent = icon || 'check_circle';
        $toast.classList.add('show');
        clearTimeout(_tt);
        _tt = setTimeout(function () {
          $toast.classList.remove('show');
        }, 2500);
      }

      // ===================== DIALOG =====================
      function showDialog(html) {
        return new Promise(function (resolve) {
          var ov = document.createElement('div');
          ov.className = 'dialog-overlay';
          ov.innerHTML = '<div class="dialog-box">' + html + '</div>';
          document.body.appendChild(ov);
          ov.querySelectorAll('.btn-dlg').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var v = this.getAttribute('data-result');
              ov.remove();
              resolve(v === 'true' || v === true);
            });
          });
          ov.addEventListener('click', function (e) {
            if (e.target === ov) {
              ov.remove();
              resolve(false);
            }
          });
        });
      }

      // ===================== ZOOM =====================
      function applyZoom() {
        var w = $pdfWrap.clientWidth,
          h = $pdfWrap.clientHeight;
        $pdfFrame.style.transform = 'scale(' + zoomLevel + ')';
        $pdfFrame.style.transformOrigin = '0 0';
        $pdfFrame.style.width = w + 'px';
        $pdfFrame.style.height = h + 'px';
        $pdfFrame.style.marginRight = Math.max(0, Math.round(w * (zoomLevel - 1))) + 'px';
        $pdfFrame.style.marginBottom = Math.max(0, Math.round(h * (zoomLevel - 1))) + 'px';
        $zoomPct.textContent = Math.round(zoomLevel * 100) + '%';
        if (Math.abs(zoomLevel - 1) < 0.01) $zoomBar.classList.add('dim');
        else $zoomBar.classList.remove('dim');
      }
      function zoomIn() {
        zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel + ZOOM_STEP).toFixed(2));
        applyZoom();
      }
      function zoomOut() {
        zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel - ZOOM_STEP).toFixed(2));
        applyZoom();
      }
      function zoomReset() {
        zoomLevel = 1;
        $pdfWrap.scrollTop = 0;
        $pdfWrap.scrollLeft = 0;
        applyZoom();
      }

      document.getElementById('zoomIn').addEventListener('click', zoomIn);
      document.getElementById('zoomOut').addEventListener('click', zoomOut);
      document.getElementById('zoomReset').addEventListener('click', zoomReset);

      $pdfWrap.addEventListener(
        'wheel',
        function (e) {
          if ((e.ctrlKey || e.metaKey) && !isFrozen) {
            e.preventDefault();
            e.deltaY < 0 ? zoomIn() : zoomOut();
          }
        },
        { passive: false },
      );

      var _pinchD0 = 0,
        _pinchZ0 = 1,
        _isPinch = false;
      function tDist(t) {
        var dx = t[0].clientX - t[1].clientX,
          dy = t[0].clientY - t[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      $pdfWrap.addEventListener(
        'touchstart',
        function (e) {
          if (e.touches.length === 2 && !isFrozen) {
            _pinchD0 = tDist(e.touches);
            _pinchZ0 = zoomLevel;
            _isPinch = true;
          }
        },
        { passive: true },
      );
      $pdfWrap.addEventListener(
        'touchmove',
        function (e) {
          if (_isPinch && e.touches.length === 2) {
            e.preventDefault();
            var s = tDist(e.touches) / Math.max(1, _pinchD0);
            zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(_pinchZ0 * s).toFixed(2)));
            applyZoom();
          }
        },
        { passive: false },
      );
      $pdfWrap.addEventListener(
        'touchend',
        function (e) {
          if (e.touches.length < 2) _isPinch = false;
        },
        { passive: true },
      );
      window.addEventListener('resize', function () {
        if (!$test.classList.contains('hidden')) applyZoom();
      });

      // ===================== AUDIO =====================
      function updateAudioBtn() {
        var has = AUDIO_MAP[currentSoal];
        var canPlay = has && !isSubmitted && !isFrozen;
        if (canPlay) {
          $audioBtn.classList.add('vis');
          if (isAudioPlaying) {
            $audioBtn.classList.add('playing');
            $audioBtn.querySelector('.material-icons-round').textContent = 'stop';
          } else {
            $audioBtn.classList.remove('playing');
            $audioBtn.querySelector('.material-icons-round').textContent = 'headphones';
          }
        } else {
          $audioBtn.classList.remove('vis', 'playing');
          $audioBtn.querySelector('.material-icons-round').textContent = 'headphones';
        }
      }

      function toggleAudio() {
        if (isFrozen || isSubmitted) return;
        if (isAudioPlaying) {
          stopAudio();
          return;
        }
        var url = AUDIO_MAP[currentSoal];
        if (!url) return;
        stopAudio();
        currentAudio = new Audio(url);
        currentAudio.play().catch(function (e) {
          console.warn('Audio error:', e);
          showToast('Gagal memutar audio', 'error_outline');
        });
        isAudioPlaying = true;
        currentAudio.addEventListener('ended', function () {
          isAudioPlaying = false;
          updateAudioBtn();
        });
        currentAudio.addEventListener('error', function () {
          isAudioPlaying = false;
          updateAudioBtn();
          showToast('Audio tidak ditemukan', 'error_outline');
        });
        updateAudioBtn();
      }

      function stopAudio() {
        if (currentAudio) {
          try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          } catch (_) {}
          currentAudio = null;
        }
        isAudioPlaying = false;
        updateAudioBtn();
      }

      $audioBtn.addEventListener('click', toggleAudio);

      // ===================== TIMER =====================
      function startTimer() {
        stopTimer();
        updateTimerDisplay();
        _saveTick = 0;
        timerInterval = setInterval(function () {
          if (isFrozen || isSubmitted) return;
          remainingTime = Math.max(0, remainingTime - 1);
          _saveTick++;
          if (_saveTick % 10 === 0) simpanSesi();
          updateTimerDisplay();
          if (remainingTime <= 0) freezeApp();
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function updateTimerDisplay() {
        var m = Math.floor(remainingTime / 60),
          s = remainingTime % 60;
        $timerDisplay.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        $timerStrip.classList.remove('warn', 'crit');
        if (remainingTime <= 60) $timerStrip.classList.add('crit');
        else if (remainingTime <= 300) $timerStrip.classList.add('warn');
      }

      // ===================== FREEZE (waktu habis) =====================
      async function freezeApp() {
        isFrozen = true;
        stopTimer();
        stopAudio();

        // Bekukan semua kontrol
        $prevBtn.disabled = true;
        $nextBtn.disabled = true;
        $answerRow.querySelectorAll('.answer-btn').forEach(function (b) {
          b.disabled = true;
        });
        $audioBtn.disabled = true;
        document.getElementById('zoomIn').disabled = true;
        document.getElementById('zoomOut').disabled = true;
        document.getElementById('zoomReset').disabled = true;

        // Overlay gelap
        var freezeOv = document.createElement('div');
        freezeOv.className = 'freeze-overlay';
        document.body.appendChild(freezeOv);

        // Dialog waktu habis — TANPA tombol batal
        var total = Object.keys(jawaban).length;
        var rawUrl = GOOGLE_SHEET_URL.trim();
        var canSend = rawUrl.length > 0 && /\/exec$/.test(rawUrl);
        var cLabel = canSend ? 'Kirim Sekarang' : 'Simpan Lokal';
        var cClass = canSend ? 'green' : 'amber';

        var ov = document.createElement('div');
        ov.className = 'dialog-overlay';
        ov.style.zIndex = '510';
        ov.innerHTML =
          '<div class="dialog-box">' +
          '<span class="material-icons-round dlg-icon" style="color:var(--danger)">timer_off</span>' +
          '<h3>Waktu Habis</h3>' +
          '<p>Batas waktu ' +
          TIMER_MINUTES +
          ' menit telah berakhir.</p>' +
          '<div style="margin:12px 0 0;">' +
          '<div class="summary-row"><span class="summary-label">Nama</span><span class="summary-val">' +
          userName +
          '</span></div>' +
          '<div class="summary-row"><span class="summary-label">Terjawab</span><span class="summary-val">' +
          total +
          ' / ' +
          TOTAL_SOAL +
          '</span></div>' +
          '</div>' +
          '<div class="actions">' +
          '<button class="btn-dlg ' +
          cClass +
          '" id="timeUpBtn" style="flex:1">' +
          cLabel +
          '</button>' +
          '</div>' +
          '</div>';
        document.body.appendChild(ov);

        await new Promise(function (resolve) {
          document.getElementById('timeUpBtn').addEventListener('click', function () {
            this.innerHTML = '<span class="spinner"></span>';
            this.disabled = true;
            this.style.opacity = '0.7';
            resolve(true);
          });
        });

        // Kirim
        var sendOk = true;
        if (canSend) {
          try {
            await Promise.all([
              kirimKeSheet({ nama: userName, total: TOTAL_SOAL, jawaban: jawaban, waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) }),
              new Promise(function (r) {
                setTimeout(r, 1500);
              }),
            ]);
          } catch (e) {
            sendOk = false;
          }
        }

        ov.remove();
        freezeOv.remove();
        await finishSubmit(canSend, sendOk, total);
      }

      // ===================== UPDATE UI =====================
      function updateUI() {
        $curNum.textContent = currentSoal;
        $prevBtn.disabled = currentSoal <= 1 || isSubmitted || isFrozen;
        $nextBtn.disabled = currentSoal >= TOTAL_SOAL || isSubmitted || isFrozen;
        $submitBtn.disabled = isSubmitted || isFrozen;

        var sel = jawaban[currentSoal] || null;
        $answerRow.querySelectorAll('.answer-btn').forEach(function (b) {
          b.classList.toggle('selected', b.dataset.a === sel);
          b.disabled = isSubmitted || isFrozen;
        });

        if (sel) $qDot.classList.add('on');
        else $qDot.classList.remove('on');
        $progFill.style.width = (Object.keys(jawaban).length / TOTAL_SOAL) * 100 + '%';
        updateAudioBtn();
      }

      // ===================== NAVIGASI =====================
      function pindahSoal(arah) {
        if (isSubmitted || isFrozen) return;
        if (zoomLevel > 1.1) return; // swipe nonaktif saat zoom
        var n = currentSoal + arah;
        if (n < 1 || n > TOTAL_SOAL) return;
        stopAudio();
        currentSoal = n;
        simpanSesi();
        updateUI();
      }

      // ===================== JAWABAN =====================
      function pilihJawaban(jwb) {
        if (isSubmitted || isFrozen) return;
        var prev = jawaban[currentSoal];
        jawaban[currentSoal] = jwb;
        updateUI();
        simpanSesi();
        if (prev !== jwb) showToast('Soal ' + currentSoal + ' \u2192 ' + jwb);
      }

      // ===================== KIRIM SHEETS =====================
      function kirimKeSheet(payload) {
        var p = new URLSearchParams();
        p.append('payload', JSON.stringify(payload));
        return fetch(GOOGLE_SHEET_URL, { method: 'POST', mode: 'no-cors', body: p });
      }

      // ===================== FINISH SUBMIT (shared) =====================
      async function finishSubmit(canSend, sendOk, total) {
        isSubmitted = true;
        isFrozen = true;
        stopTimer();
        stopAudio();
        hapusSesi();

        var sIcon = canSend && sendOk ? 'cloud_done' : 'save';
        var sTitle = canSend && sendOk ? 'Jawaban Terkirim' : 'Tersimpan Lokal';
        var sDesc = canSend && sendOk ? 'Semua jawaban berhasil dikirim ke Google Sheets.' : canSend ? 'Gagal mengirim. Jawaban tersimpan di perangkat ini.' : 'Konfigurasi Google Sheets untuk pengiriman otomatis.';

        await showDialog(
          '<span class="material-icons-round dlg-icon" style="color:var(--accent)">' +
            sIcon +
            '</span>' +
            '<h3>' +
            sTitle +
            '</h3><p>' +
            sDesc +
            '</p>' +
            '<div style="margin:12px 0 0;">' +
            '<div class="summary-row"><span class="summary-label">Nama</span><span class="summary-val">' +
            userName +
            '</span></div>' +
            '<div class="summary-row"><span class="summary-label">Terjawab</span><span class="summary-val">' +
            total +
            ' / ' +
            TOTAL_SOAL +
            '</span></div>' +
            '<div class="summary-row"><span class="summary-label">Waktu</span><span class="summary-val">' +
            new Date().toLocaleTimeString('id-ID') +
            '</span></div>' +
            '</div>' +
            '<div class="actions"><button class="btn-dlg green" data-result="true" style="flex:1">Selesai</button></div>',
        );

        $panel.classList.add('submitted');
        $doneText.textContent = 'Terkirim \u2014 ' + total + '/' + TOTAL_SOAL;
        $submitBtn.classList.add('done');
        $submitBtn.querySelector('.material-icons-round').textContent = 'check';
        $submitBtn.disabled = true;
        $timerStrip.style.display = 'none';
        updateUI();
        showToast(sTitle, sIcon);
      }

      // ===================== SUBMIT MANUAL =====================
      async function handleSubmit() {
        if (isSubmitted || isFrozen) return;

        var total = Object.keys(jawaban).length;
        var belum = TOTAL_SOAL - total;
        var rawUrl = GOOGLE_SHEET_URL.trim();
        var canSend = rawUrl.length > 0 && /\/exec$/.test(rawUrl);

        var gridHtml = '';
        for (var i = 1; i <= TOTAL_SOAL; i++) {
          var j = jawaban[i] || '-';
          var clr = jawaban[i] ? 'color:var(--accent-light)' : 'color:var(--muted);opacity:.5';
          gridHtml += '<span style="' + clr + '">' + i + '.' + j + '</span>';
        }

        var warnHtml = '';
        if (belum > 0) warnHtml += '<div class="warn"><span class="material-icons-round" style="font-size:15px">warning_amber</span> ' + belum + ' soal belum dijawab</div>';
        if (!rawUrl.length) warnHtml += '<div class="warn" style="margin-top:4px"><span class="material-icons-round" style="font-size:15px">cloud_off</span> Google Sheets belum dikonfigurasi</div>';
        else if (!/\/exec$/.test(rawUrl)) warnHtml += '<div class="warn" style="margin-top:4px"><span class="material-icons-round" style="font-size:15px">error_outline</span> URL harus berakhiran /exec</div>';

        var cLabel = canSend ? 'Kirim Sekarang' : 'Simpan Lokal';
        var cClass = canSend ? 'green' : 'amber';

        var ov = document.createElement('div');
        ov.className = 'dialog-overlay';
        ov.innerHTML =
          '<div class="dialog-box">' +
          '<span class="material-icons-round dlg-icon" style="color:var(--amber)">send</span>' +
          '<h3>Kirim Jawaban</h3>' +
          '<div style="margin:12px 0 4px;">' +
          '<div class="summary-row"><span class="summary-label">Nama</span><span class="summary-val">' +
          userName +
          '</span></div>' +
          '<div class="summary-row"><span class="summary-label">Dijawab</span><span class="summary-val">' +
          total +
          ' / ' +
          TOTAL_SOAL +
          '</span></div>' +
          '</div>' +
          '<div class="answer-grid">' +
          gridHtml +
          '</div>' +
          warnHtml +
          '<div class="actions">' +
          '<button class="btn-dlg cancel" id="sCancel">Batal</button>' +
          '<button class="btn-dlg ' +
          cClass +
          '" id="sConfirm">' +
          cLabel +
          '</button>' +
          '</div>' +
          '</div>';
        document.body.appendChild(ov);

        var ok = await new Promise(function (resolve) {
          document.getElementById('sCancel').addEventListener('click', function () {
            ov.remove();
            resolve(false);
          });
          document.getElementById('sConfirm').addEventListener('click', function () {
            this.innerHTML = '<span class="spinner"></span>';
            this.disabled = true;
            this.style.opacity = '0.7';
            resolve(true);
          });
          ov.addEventListener('click', function (e) {
            if (e.target === ov) {
              ov.remove();
              resolve(false);
            }
          });
        });
        if (!ok) return;

        var sendOk = true;
        if (canSend) {
          try {
            await Promise.all([
              kirimKeSheet({ nama: userName, total: TOTAL_SOAL, jawaban: jawaban, waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) }),
              new Promise(function (r) {
                setTimeout(r, 1500);
              }),
            ]);
          } catch (e) {
            sendOk = false;
          }
        }
        ov.remove();
        await finishSubmit(canSend, sendOk, total);
      }

      // ===================== SCREEN =====================
      function showScreen(target) {
        $welcome.classList.remove('visible');
        $welcome.classList.add('hidden');
        $test.classList.remove('visible');
        $test.classList.add('hidden');
        target.classList.remove('hidden');
        target.classList.add('visible');
      }

      // ===================== MULAI TES =====================
      function mulaiTes() {
        userName = $nameInput.value.trim();
        if (!userName) return;
        hapusSesi();
        currentSoal = 1;
        jawaban = {};
        isSubmitted = false;
        isFrozen = false;
        zoomLevel = 1;
        remainingTime = TIMER_MINUTES * 60;
        $pdfFrame.src = PDF_URL;
        $pdfFrame.style.transform = '';
        $pdfFrame.style.marginRight = '';
        $pdfFrame.style.marginBottom = '';
        $resetBtn.style.display = 'block';
        $zoomBar.style.display = 'flex';
        $timerStrip.style.display = 'flex';
        $panel.classList.remove('submitted');
        $submitBtn.classList.remove('done');
        $submitBtn.querySelector('.material-icons-round').textContent = 'send';
        showScreen($test);
        setTimeout(function () {
          applyZoom();
          startTimer();
        }, 120);
        simpanSesi();
        updateUI();
        showToast('Tes dimulai \u2014 ' + userName);
      }

      // ===================== LANJUTKAN SESI =====================
      function lanjutkanSesi(s) {
        userName = s.nama || '';
        currentSoal = s.currentSoal || 1;
        jawaban = s.jawaban || {};
        isSubmitted = false;
        isFrozen = false;
        zoomLevel = 1;
        // Hitung sisa waktu
        remainingTime = s.remainingTime || TIMER_MINUTES * 60;
        if (s.ts) {
          var elapsed = Math.floor((Date.now() - s.ts) / 1000);
          remainingTime = Math.max(0, remainingTime - elapsed);
        }
        $nameInput.value = userName;
        $pdfFrame.src = PDF_URL;
        $pdfFrame.style.transform = '';
        $pdfFrame.style.marginRight = '';
        $pdfFrame.style.marginBottom = '';
        $resetBtn.style.display = 'block';
        $zoomBar.style.display = 'flex';
        $timerStrip.style.display = 'flex';
        $panel.classList.remove('submitted');
        $submitBtn.classList.remove('done');
        $submitBtn.querySelector('.material-icons-round').textContent = 'send';
        showScreen($test);
        setTimeout(function () {
          applyZoom();
          if (remainingTime <= 0) {
            freezeApp();
          } else {
            startTimer();
          }
        }, 120);
        updateUI();
        showToast('Lanjutkan \u2014 ' + userName, 'history');
      }

      // ===================== RESET =====================
      async function handleReset() {
        if (!isSubmitted && !isFrozen && Object.keys(jawaban).length > 0) {
          var ok = await showDialog(
            '<span class="material-icons-round dlg-icon" style="color:var(--danger)">warning_amber</span>' +
              '<h3>Hapus Sesi?</h3><p>Semua jawaban yang belum dikirim akan hilang.</p>' +
              '<div class="actions"><button class="btn-dlg cancel" data-result="false">Batal</button><button class="btn-dlg red" data-result="true">Hapus</button></div>',
          );
          if (!ok) return;
        }
        stopTimer();
        stopAudio();
        hapusSesi();
        isSubmitted = false;
        isFrozen = false;
        zoomLevel = 1;
        remainingTime = TIMER_MINUTES * 60;
        $pdfFrame.src = 'about:blank';
        $pdfFrame.style.transform = '';
        $pdfFrame.style.marginRight = '';
        $pdfFrame.style.marginBottom = '';
        $resetBtn.style.display = 'none';
        $zoomBar.style.display = 'none';
        $timerStrip.style.display = 'none';
        $progFill.style.width = '0%';
        // Hapus freeze overlay jika ada
        var fo = document.querySelector('.freeze-overlay');
        if (fo) fo.remove();
        showScreen($welcome);
        setTimeout(function () {
          $nameInput.focus();
        }, 400);
      }

      // ===================== EVENTS =====================
      $nameInput.addEventListener('input', function () {
        $startBtn.disabled = !this.value.trim();
      });
      $nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && this.value.trim()) mulaiTes();
      });
      $startBtn.addEventListener('click', mulaiTes);
      $resumeBtn.addEventListener('click', function () {
        var s = muatSesi();
        if (s) lanjutkanSesi(s);
      });
      $prevBtn.addEventListener('click', function () {
        pindahSoal(-1);
      });
      $nextBtn.addEventListener('click', function () {
        pindahSoal(1);
      });
      $submitBtn.addEventListener('click', handleSubmit);
      $resetBtn.addEventListener('click', handleReset);

      var abtns = $answerRow.querySelectorAll('.answer-btn');
      for (var i = 0; i < abtns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            pilihJawaban(btn.dataset.a);
          });
        })(abtns[i]);
      }

      // Keyboard
      document.addEventListener('keydown', function (e) {
        if ($test.classList.contains('hidden') || isFrozen) return;
        if (document.querySelector('.dialog-overlay')) return;
        if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
          e.preventDefault();
          zoomIn();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === '-') {
          e.preventDefault();
          zoomOut();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === '0') {
          e.preventDefault();
          zoomReset();
          return;
        }
        switch (e.key) {
          case 'ArrowLeft':
            e.preventDefault();
            pindahSoal(-1);
            break;
          case 'ArrowRight':
            e.preventDefault();
            pindahSoal(1);
            break;
          case 'a':
          case 'A':
            pilihJawaban('A');
            break;
          case 'b':
          case 'B':
            pilihJawaban('B');
            break;
          case 'c':
          case 'C':
            pilihJawaban('C');
            break;
          case 'd':
          case 'D':
            pilihJawaban('D');
            break;
          case 'e':
          case 'E':
            pilihJawaban('E');
            break;
          case 'Enter':
            if (!isSubmitted) handleSubmit();
            break;
        }
      });

      // Swipe
      var _tx = 0,
        _ty = 0;
      document.addEventListener(
        'touchstart',
        function (e) {
          if ($test.classList.contains('hidden') || isFrozen || e.target.closest('.floating-panel') || document.querySelector('.dialog-overlay')) return;
          if (e.touches.length === 1) {
            _tx = e.touches[0].clientX;
            _ty = e.touches[0].clientY;
          }
        },
        { passive: true },
      );
      document.addEventListener(
        'touchend',
        function (e) {
          if ($test.classList.contains('hidden') || isFrozen || e.target.closest('.floating-panel') || document.querySelector('.dialog-overlay')) return;
          if (e.changedTouches.length !== 1 || zoomLevel > 1.1) return;
          var dx = e.changedTouches[0].clientX - _tx,
            dy = e.changedTouches[0].clientY - _ty;
          if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) pindahSoal(dx < 0 ? 1 : -1);
        },
        { passive: true },
      );

      // ===================== INIT =====================
      (function () {
        var s = muatSesi();
        if (s && s.nama) {
          var n = Object.keys(s.jawaban || {}).length;
          if (n > 0) {
            $resumeBanner.style.display = 'flex';
            $resumeText.textContent = s.nama + ' \u2014 ' + n + '/' + TOTAL_SOAL + ' terjawab';
          }
        }
        setTimeout(function () {
          $nameInput.focus();
        }, 500);
      })();
    </script>
  </body>
</html>
